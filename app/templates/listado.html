<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgendaTec</title>
</head>
<body>
    <h1>AgendaTec</h1>

    <p>
        <a href="{{ url_for('contacto.nuevo_contacto') }}">Nuevo contacto</a>
    </p>

    <ul>
        {% for contacto in contactos %}
        <li>
            {{ contacto.nombre }} - {{ contacto.telefono }} - {{ contacto.correo }}
            <a href="#">[Editar]</a>
            <a href="#">[Eliminar]</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
